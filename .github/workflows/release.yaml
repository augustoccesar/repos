name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"

jobs:
  check_version:
    name: Check for version change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Version
        id: check
        run: |
          new_version=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          old_version=$(git show HEAD^:Cargo.toml | grep '^version = ' | sed -E 's/version = "(.*)"/\1/')

          echo "New version: $new_version"
          echo "Old version: $old_version"

          if [ "$new_version" = "$old_version" ]; then
            echo "No version change detected."
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "new_version=''" >> $GITHUB_OUTPUT
          else
            echo "Version change detected."
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$new_version" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check_version]
    name: Build
    runs-on: ${{matrix.os}}
    if: ${{ needs.check_version.outputs.version_changed == 'true' }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup install stable
          rustup target add ${{ matrix.target }}
          rustup show

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Get Version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package Artifacts
        id: package-artifacts
        run: |
          src=$(pwd)
          stage=
          case $RUNNER_OS in
              Linux)
                  stage=$(mktemp -d)
                  ;;
              macOS)
                  stage=$(mktemp -d -t tmp)
                  ;;
          esac

          cp target/${{ matrix.target }}/release/repos $stage/
          cd $stage

          RELEASE_VERSION=${{ steps.get_version.outputs.release_version }}
          ASSET_NAME="repos-$RELEASE_VERSION-${{ matrix.target }}.tar.gz"

          ASSET_PATH="$src/$ASSET_NAME"
          CHECKSUM_PATH="$ASSET_PATH.sha256"

          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "checksum_path=$CHECKSUM_PATH" >> $GITHUB_OUTPUT

          tar czf $ASSET_PATH *

          cd $src

          case $RUNNER_OS in
              Linux)
                  sha256sum $ASSET_NAME > $CHECKSUM_PATH
                  ;;
              macOS)
                  shasum -a 256 $ASSET_NAME > $CHECKSUM_PATH
                  ;;
          esac

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.release_version }}
          files: |
            ${{ steps.package-artifacts.outputs.asset_path }}
            ${{ steps.package-artifacts.outputs.checksum_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
